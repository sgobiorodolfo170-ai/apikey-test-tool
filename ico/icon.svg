<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <clipPath id="roundedClip">
      <rect x="32" y="32" width="448" height="448" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background shadow -->
  <rect x="32" y="36" width="448" height="448" rx="96" fill="#1E3A8A" opacity="0.3"/>

  <!-- Background gradient -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Gloss highlight -->
  <rect x="32" y="32" width="448" height="224" rx="96" fill="url(#gloss)" clip-path="url(#roundedClip)"/>

  <!-- Key icon group -->
  <g transform="translate(256,260)" filter="url(#shadow)">
    <!-- Key ring (top circle) -->
    <circle cx="0" cy="-70" r="48" fill="none" stroke="white" stroke-width="18" opacity="0.9"/>
    <circle cx="0" cy="-70" r="22" fill="none" stroke="white" stroke-width="6" opacity="0.4"/>

    <!-- Key shaft -->
    <rect x="-14" y="-22" width="28" height="110" rx="6" fill="white" opacity="0.9"/>

    <!-- Key teeth -->
    <rect x="14" y="32" width="44" height="14" rx="5" fill="white" opacity="0.9"/>
    <rect x="14" y="60" width="34" height="14" rx="5" fill="white" opacity="0.9"/>

    <!-- Key inner line detail -->
    <rect x="-6" y="-22" width="12" height="100" rx="3" fill="white" opacity="0.2"/>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(380, 380)">
    <circle cx="0" cy="0" r="44" fill="#22C55E" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
    <path d="M-20 -2 L-6 12 L22 -16" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
